# Build and test gate for the published tree.
#
# What a fresh clone can prove, and nothing it cannot. Every package compiles on
# every platform it supports; osgraph additionally runs its **published** test suite.
#
# osgraph's tests are split by fixture provenance (osgraph/tests/PROVENANCE.md): a
# test reading a capture that carries real module/application/entity/screen names is
# git-ignored, so it is absent from a clone and cannot run here. `npm test` would
# therefore run a different, smaller set in CI than on a developer machine — silently.
# `npm run test:published` instead names its files explicitly in
# osgraph/vitest.published.config.ts, so CI runs a known set and a missing file is an
# error rather than a quietly shrinking suite. It needs no Service Studio, no
# osopener, no session token and no network.
#
# `npm run lint` is still not run here: it lints `src tests`, and most of `tests/` is
# not in the clone.
#
# osopener has no published suite yet — its tests drive a live Windows GUI.
#
# The matrix is written out per package rather than as a cross product, because
# osopener declares `"os": ["win32"]` (it drives Windows UI Automation) and `npm ci`
# refuses to install it anywhere else with EBADPLATFORM. Windows-only is a fact about
# osopener, not a gap in its coverage.
name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build+test (${{ matrix.package }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # osgraph is platform-agnostic: ubuntu is the cheap leg, windows is the one
          # platform Service Studio exists on and where the win32-only code paths run.
          - { package: osgraph, os: ubuntu-latest }
          - { package: osgraph, os: windows-latest }
          # osopener is win32-only by declaration.
          - { package: osopener, os: windows-latest }
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci

      - run: npm run build

      # osgraph only: see the header. `test:published` re-runs the build, which is
      # cheap and keeps the script usable on its own from a fresh clone.
      - run: npm run test:published
        if: matrix.package == 'osgraph'
