# Build gate for the published tree.
#
# Deliberately narrow: the published repository ships `src/` only — the test suites
# and scope fixtures are excluded because they carry real module names — so there is
# nothing here for `npm test` or `npm run lint` (which lints `src tests`) to run
# against. This workflow therefore proves exactly what a fresh clone can prove:
# each server installs and compiles on every platform it actually supports.
#
# The matrix is written out per package rather than as a cross product, because
# osopener declares `"os": ["win32"]` (it drives Windows UI Automation) and `npm ci`
# refuses to install it anywhere else with EBADPLATFORM. Windows-only is a fact about
# osopener, not a gap in its coverage.
name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.package }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # osgraph is platform-agnostic: ubuntu is the cheap leg, windows is the one
          # platform Service Studio exists on and where the win32-only code paths run.
          - { package: osgraph, os: ubuntu-latest }
          - { package: osgraph, os: windows-latest }
          # osopener is win32-only by declaration.
          - { package: osopener, os: windows-latest }
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci

      - run: npm run build
