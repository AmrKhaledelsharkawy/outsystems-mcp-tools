# Build gate for the published tree.
#
# Deliberately narrow: the published repository ships `src/` only — the test suites
# and scope fixtures are excluded because they carry real module names — so there is
# nothing here for `npm test` or `npm run lint` (which lints `src tests`) to run
# against. This workflow therefore proves exactly what a fresh clone can prove:
# both servers install and compile, on both platforms.
name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [osgraph, osopener]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci

      - run: npm run build
